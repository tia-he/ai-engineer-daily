name: One-off - remove dev seed data

# Temporary, manually-triggered cleanup for the 3 dummy articles that
# init_db.py seeds for local development (openai-coding-model,
# google-mcp-sdk, cursor-agent), which ended up in the production
# database. Delete this workflow file after running it once.

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete dev-seed articles
        run: |
          python -c "
          from sqlalchemy import delete
          from database import SessionLocal
          from models import Article

          SEED_IDS = ['openai-coding-model', 'google-mcp-sdk', 'cursor-agent']

          with SessionLocal() as db:
              result = db.execute(delete(Article).where(Article.id.in_(SEED_IDS)))
              db.commit()
              print(f'Deleted {result.rowcount} row(s).')
          "
